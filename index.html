<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronómetro formas de pago</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; text-align: center; background: #fff; color: #222; }
  h1 { font-size: 1.1rem; margin: 0 0 12px; }
  #tiempo { font-size: 3.5rem; font-variant-numeric: tabular-nums; margin: 12px 0; }
  input { font-size: 1rem; padding: 8px; width: 80%; max-width: 280px; margin-bottom: 12px; }
  button { font-size: 1rem; padding: 10px 20px; margin: 4px; border: 0; border-radius: 8px; cursor: pointer; color: #fff; }
  #btnIniciar { background: #2e9e5b; }
  #btnParar { background: #d64545; }
  #btnReset { background: #777; }
  #btnVer { background: #3b6fd4; margin-top: 0; }
  button:disabled { opacity: .4; cursor: default; }
  #msg { min-height: 1.4em; margin-top: 8px; font-size: .95rem; }
  .oculto { display: none; }
  .fila { max-width: 480px; margin: 14px auto; text-align: left; }
  .fila .cab { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .barra-fondo { background: #eee; border-radius: 6px; height: 22px; overflow: hidden; }
  .barra { height: 100%; border-radius: 6px; background: #8aa4d6; transition: width .4s; }
  .barra.mejor { background: #2e9e5b; }
  .nota { font-size: .85rem; color: #777; }
  #relojEtiqueta { font-size: .95rem; color: #555; }
  #relojTiempo { font-size: 2.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<!-- VISTA CRONÓMETRO -->
<div id="vistaCrono">
  <h1 id="titulo">Cronómetro</h1>
  <input id="nombre" placeholder="Tu nombre" maxlength="40">
  <div id="tiempo">00:00.00</div>
  <button id="btnIniciar">Iniciar</button>
  <button id="btnParar" disabled>Parar y guardar</button>
  <button id="btnReset" disabled>Reiniciar</button>
  <div id="msg"></div>
</div>

<!-- VISTA RELOJ (solo muestra el tiempo) -->
<div id="vistaReloj" class="oculto">
  <div id="relojEtiqueta">Cronómetro</div>
  <div id="relojTiempo">00:00.00</div>
</div>

<!-- VISTA RESULTADOS -->
<div id="vistaResultados" class="oculto">
  <h1>Comparación de tus tiempos</h1>
  <input id="nombreRes" placeholder="Tu nombre" maxlength="40">
  <button id="btnVer">Ver mis resultados</button>
  <div id="comparacion"></div>
  <p id="estado" class="nota"></p>
</div>

<script>
  const URL_SCRIPT = "PEGA_AQUI_LA_URL_DE_APPS_SCRIPT";
  const METODOS = { efectivo: "Efectivo", transferencia: "Transferencia", bizum: "Bizum" };
  const params = new URLSearchParams(location.search);
  const vista = params.get("vista");
  const metodo = (params.get("metodo") || "").toLowerCase();

  function formato(seg) {
    const m = Math.floor(seg / 60);
    const s = (seg % 60).toFixed(2).padStart(5, "0");
    return String(m).padStart(2, "0") + ":" + s;
  }
  function guardarNombre(n) { try { localStorage.setItem("nombreCrono", n); } catch (e) {} }
  function leerNombre() { try { return localStorage.getItem("nombreCrono") || ""; } catch (e) { return ""; } }
  const norm = s => (s || "").toString().trim().toLowerCase();

  if (vista === "resultados") {
    document.getElementById("vistaCrono").classList.add("oculto");
    document.getElementById("vistaResultados").classList.remove("oculto");
    const $nr = document.getElementById("nombreRes");
    $nr.value = leerNombre();

    async function cargar() {
      const nombre = norm($nr.value);
      const cont = document.getElementById("comparacion");
      const estado = document.getElementById("estado");
      if (!nombre) { cont.innerHTML = ""; estado.textContent = "Escribe tu nombre para ver tus resultados."; return; }
      try {
        const r = await fetch(URL_SCRIPT);
        const datos = await r.json();
        const mios = {};
        datos.forEach(d => {
          if (norm(d.nombre) === nombre && METODOS[norm(d.metodo)] && typeof d.segundos === "number") {
            mios[norm(d.metodo)] = d.segundos; // se queda con el último intento
          }
        });
        const tiempos = Object.values(mios);
        const max = Math.max(...tiempos, 1);
        const mejor = tiempos.length ? Math.min(...tiempos) : null;
        cont.innerHTML = "";
        Object.keys(METODOS).forEach(k => {
          const fila = document.createElement("div");
          fila.className = "fila";
          const cab = document.createElement("div");
          cab.className = "cab";
          const a = document.createElement("span"); a.textContent = METODOS[k];
          const b = document.createElement("span");
          b.textContent = k in mios ? formato(mios[k]) : "Pendiente";
          cab.appendChild(a); cab.appendChild(b);
          const fondo = document.createElement("div"); fondo.className = "barra-fondo";
          const barra = document.createElement("div");
          barra.className = "barra" + (k in mios && mios[k] === mejor && tiempos.length === 3 ? " mejor" : "");
          barra.style.width = k in mios ? (mios[k] / max * 100) + "%" : "0%";
          fondo.appendChild(barra);
          fila.appendChild(cab); fila.appendChild(fondo);
          cont.appendChild(fila);
        });
        estado.textContent = tiempos.length === 3
          ? "Verde = tu forma de pago más rápida."
          : "Faltan " + (3 - tiempos.length) + " forma(s) de pago por completar.";
      } catch (e) {
        estado.textContent = "No se pudieron cargar los datos.";
      }
    }
    document.getElementById("btnVer").onclick = () => { guardarNombre($nr.value.trim()); cargar(); };
    if ($nr.value) cargar(); else cargar();
    setInterval(cargar, 5000);

  } else if (vista === "reloj") {
    document.getElementById("vistaCrono").classList.add("oculto");
    document.getElementById("vistaReloj").classList.remove("oculto");
    document.body.style.background = "transparent";
    const $rt = document.getElementById("relojTiempo");
    const $re = document.getElementById("relojEtiqueta");
    const lee = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    function actualizar() {
      const lista = METODOS[metodo] ? [metodo] : Object.keys(METODOS);
      for (const k of lista) {
        const ini = Number(lee("crono_ini_" + k));
        if (ini) {
          $re.textContent = METODOS[k] + " · en marcha";
          $rt.textContent = formato((Date.now() - ini) / 1000);
          return;
        }
      }
      if (METODOS[metodo]) {
        const fin = lee("crono_fin_" + metodo);
        if (fin) { $re.textContent = METODOS[metodo] + " · terminado"; $rt.textContent = formato(Number(fin)); return; }
      }
      $re.textContent = "Sin cronómetro en marcha";
      $rt.textContent = "00:00.00";
    }
    actualizar();
    setInterval(actualizar, 50);

  } else {
    const $t = document.getElementById("tiempo");
    const $i = document.getElementById("btnIniciar");
    const $p = document.getElementById("btnParar");
    const $r = document.getElementById("btnReset");
    const $n = document.getElementById("nombre");
    const $m = document.getElementById("msg");
    $n.value = leerNombre();
    let inicio = 0, timer = null, ultimo = 0;
    const K_INI = "crono_ini_" + metodo;
    const K_FIN = "crono_fin_" + metodo;
    const ls = {
      get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
      del: k => { try { localStorage.removeItem(k); } catch (e) {} }
    };

    if (!METODOS[metodo]) {
      $i.disabled = true;
      $m.textContent = "Falta indicar la forma de pago en la dirección (?metodo=efectivo, transferencia o bizum).";
    } else {
      document.getElementById("titulo").textContent = "Cronómetro: " + METODOS[metodo];
    }

    function pintar() { ultimo = (Date.now() - inicio) / 1000; $t.textContent = formato(ultimo); }

    function arrancar(desde) {
      inicio = desde;
      clearInterval(timer);
      pintar();
      timer = setInterval(pintar, 30);
      $i.disabled = true; $p.disabled = false; $r.disabled = true;
    }

    // Al cargar la página: recuperar el estado guardado
    if (METODOS[metodo]) {
      const ini = Number(ls.get(K_INI));
      const fin = ls.get(K_FIN);
      if (ini) {
        arrancar(ini);
        $m.textContent = "Cronómetro en marcha.";
      } else if (fin) {
        $t.textContent = formato(Number(fin));
        $i.disabled = true; $r.disabled = false;
        $m.textContent = "Tiempo guardado: " + formato(Number(fin));
      }
    }

    $i.onclick = () => {
      if (!$n.value.trim()) { $m.textContent = "Escribe tu nombre antes de empezar."; return; }
      guardarNombre($n.value.trim());
      const ahora = Date.now();
      ls.set(K_INI, String(ahora));
      ls.del(K_FIN);
      arrancar(ahora);
      $m.textContent = "";
    };

    $p.onclick = async () => {
      clearInterval(timer);
      pintar();
      ls.del(K_INI);
      ls.set(K_FIN, ultimo.toFixed(2));
      $p.disabled = true; $r.disabled = false;
      $m.textContent = "Guardando...";
      try {
        await fetch(URL_SCRIPT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ nombre: $n.value.trim(), metodo: metodo, segundos: Number(ultimo.toFixed(2)) })
        });
        $m.textContent = "Tiempo guardado: " + formato(ultimo);
      } catch (e) {
        $m.textContent = "No se pudo guardar el tiempo.";
      }
    };

    $r.onclick = () => {
      ls.del(K_INI); ls.del(K_FIN);
      $t.textContent = "00:00.00"; ultimo = 0;
      $i.disabled = false; $r.disabled = true; $m.textContent = "";
    };
  }
</script>
</body>
</html>
